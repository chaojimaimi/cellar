<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cellar app icon design source (color).
  Derived from the Cellar project design source, approved "cellar light" concept:
  dark cellar squircle (rx52, vertical gradient), faint ring (r62, w14),
  main charging arc (80% of r62, amber gradient, w14, round caps) with soft
  glow filter, core dot r11. 240-unit canvas with an 8-unit margin; root
  width/height are set to the 1024px export (viewBox scales the drawing).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="bgLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A3826"/>
      <stop offset="1" stop-color="#241A10"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#B4793B"/>
      <stop offset="1" stop-color="#F0C070"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="224" height="224" rx="52" fill="url(#bgLight)"/>
  <circle cx="120" cy="120" r="62" fill="none" stroke="rgba(240,192,112,.14)" stroke-width="14"/>
  <g filter="url(#glow)">
    <path d="M120 58 A62 62 0 1 1 61.03 100.84" fill="none" stroke="url(#amber)" stroke-width="14" stroke-linecap="round"/>
    <circle cx="120" cy="120" r="11" fill="#F6D9A0"/>
  </g>
</svg>