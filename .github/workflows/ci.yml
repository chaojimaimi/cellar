name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (debug)
        run: swift build

      - name: Scenario verification
        run: swift run CellarCoreCheck

      - name: Build (release)
        run: swift build -c release

  # App bundle 门禁（Phase 2 WP6 §2.2）：App/ 15 个 Swift 文件零自动化验证的
  # 现状收口。必绿门禁——不设 continue-on-error，ad-hoc 签名与发布产物同形态
  # （不设 CODE_SIGNING_ALLOWED=NO）。与 SPM job 并列无依赖。
  app-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        # 显式 pin 防镜像默认工具链漂移。macos-26 镜像默认即 Xcode 26.6
        # （2026-07-21 起），若某镜像路径不同致 xcode-select 失败，回退策略 =
        # 不 xcode-select，直接依赖 PATH 上的 xcrun xcodebuild 解析（版本以下方
        # xcodebuild -version 日志为证）。
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          else
            echo "::warning::/Applications/Xcode_26.6.app 不存在，回退 xcrun 路径解析工具链"
          fi
          xcodebuild -version

      - name: Build Cellar.app (Release)
        run: |
          xcodebuild -project App/CellarApp.xcodeproj -scheme CellarApp \
            -configuration Release -derivedDataPath App/.ci-build build

      - name: Upload Cellar.app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cellar.app
          path: App/.ci-build/Build/Products/Release/Cellar.app

  # 快照矩阵门禁（WP4 §3.2 定版）：macos-26 单一权威渲染环境（与 app-build 同
  # 镜像假设）。golden 已提交（Snapshots/Goldens/，48 张），本 job 为对比模式
  # 全绿门禁；渲染确定性依赖 pin Xcode + AppleLanguages=en（golden=en 定版）。
  snapshot:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          else
            echo "::warning::/Applications/Xcode_26.6.app 不存在，回退 xcrun 路径解析工具链"
          fi
          xcodebuild -version

      - name: Build CellarUICheck
        run: swift build --product CellarUICheck

      - name: Snapshot comparison (48 goldens)
        env:
          AppleLanguages: en
          AppleLocale: en_US
        run: swift run CellarUICheck --snapshot

      - name: Upload diff artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diff
          path: Snapshots/
          if-no-files-found: ignore

  # golden 重生成（WP4 §3.2：CI 是唯一权威渲染源——SwiftUI 运行时随工具链/镜像
  # 升级变化时，本机 regen 不算数；手动触发本 job → 目视 artifact → 提交新 golden）。
  snapshot-regen:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          else
            echo "::warning::/Applications/Xcode_26.6.app 不存在，回退 xcrun 路径解析工具链"
          fi
          xcodebuild -version

      - name: Build CellarUICheck
        run: swift build --product CellarUICheck

      - name: Regenerate goldens
        env:
          AppleLanguages: en
          AppleLocale: en_US
        run: swift run CellarUICheck --snapshot --regen

      - name: Upload regenerated goldens
        uses: actions/upload-artifact@v4
        with:
          name: goldens-regen
          path: Snapshots/Goldens/
